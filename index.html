<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Application Flox</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s, color 0.3s;
    }

    .dark-mode {
      background: linear-gradient(135deg, #121212, #1a1a1a);
      color: #ffffff;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #fff;
    }

    .google-search {
      margin-top: 30px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 600px;
    }

    .google-search input[type="text"] {
      padding: 10px;
      font-size: 16px;
      width: 70%;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .google-search button {
      padding: 10px 15px;
      font-size: 16px;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .google-search button:hover {
      background-color: #0056b3;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #ddd;
    }
  </style>
</head>
<body>
  <div class="main-content">
    <h1>Flox</h1>

    <!-- Barre de recherche Google -->
    <div class="google-search">
      <input type="text" id="googleSearchInput" placeholder="Recherchez sur Google...">
      <button onclick="performGoogleSearch()">Rechercher</button>
    </div>

    <footer>© 2025 Moteur de Recherche. Tous droits réservés.</footer>
  </div>

  <script>
    function performGoogleSearch() {
      const query = document.getElementById('googleSearchInput').value.trim();
      if (query) {
        // Rediriger vers Google avec la requête saisie
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      } else {
        alert('Veuillez entrer un terme de recherche.');
      }
    }
  </script>
</body>
</html>
