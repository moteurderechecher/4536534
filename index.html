<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Application Flox</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s, color 0.3s;
    }

    .dark-mode {
      background: linear-gradient(135deg, #121212, #1a1a1a);
      color: #ffffff;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #fff;
    }

    .account-section {
      position: absolute;
      top: 10px;
      right: 20px;
      color: white;
      display: flex;
      align-items: center;
    }

    .account-section button {
      background: #007bff;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .dark-mode .account-section button {
      background: #444;
    }

    .auth-container, .reset-container {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
    }

    .dark-mode .auth-container, .dark-mode .reset-container {
      background: #222;
      color: white;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .dark-mode input {
      background: #333;
      color: white;
      border: 1px solid #555;
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      padding: 10px 15px;
      border-radius: 5px;
      border: none;
      background: #007bff;
      color: white;
      cursor: pointer;
      margin: 5px;
    }

    .dark-mode button {
      background: #444;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #ddd;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .search-container {
      display: flex;
      width: 80%;
      max-width: 600px;
    }

    .search-container input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .search-container button {
      margin-left: 10px;
      padding: 10px 15px;
      font-size: 16px;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .search-container button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="account-section">
      <span id="user-info">Invité</span>
      <button onclick="toggleAuthForm()">Connexion</button>
      <button id="logout-btn" onclick="logout()" style="display:none;">Déconnexion</button>
    </div>

    <h1>Flox</h1>

    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Entrez votre recherche..." autocomplete="off" />
      <button onclick="searchGoogle()">Rechercher</button>
    </div>

    <div class="buttons">
      <button onclick="toggleDarkMode()">Mode Sombre 🌙</button>
      <button onclick="clearHistory()">Supprimer Historique 🗑️</button>
    </div>

    <footer>© 2025 Moteur de Recherche. Tous droits réservés.</footer>
  </div>

  <script>
    function searchGoogle() {
      const query = document.getElementById('searchInput').value.trim();
      if (query) {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      } else {
        alert('Veuillez entrer un terme de recherche.');
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }

    window.onload = function() {
      if (JSON.parse(localStorage.getItem('darkMode'))) {
        document.body.classList.add('dark-mode');
      }
      checkLoginStatus();
    };

    function toggleAuthForm() {
      const form = document.getElementById('auth-form');
      form.style.display = form.style.display === 'block' ? 'none' : 'block';
    }

    function clearHistory() {
      alert("Historique supprimé !");
    }

    function checkLoginStatus() {
      let user = localStorage.getItem('currentUser');
      if (user) {
        document.getElementById('user-info').textContent = user;
        document.getElementById('logout-btn').style.display = 'inline-block';
      }
    }
  </script>
</body>
</html>
