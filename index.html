<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recherche Flox</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      transition: background-color 0.3s, color 0.3s;
    }

    .dark-mode {
      background: linear-gradient(135deg, #121212, #1a1a1a);
      color: #ffffff;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .search-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 16px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .dark-mode input[type="text"] {
      background: #333;
      color: white;
      border: 1px solid #555;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    .dark-mode button {
      background-color: #444;
    }

    .account-section {
      position: absolute;
      top: 10px;
      right: 20px;
      color: white;
      display: flex;
      align-items: center;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #ddd;
    }

    .dark-mode footer {
      color: #999;
    }

    .dropdown {
      display: none;
      position: absolute;
      top: 50px;
      right: 0;
      background: white;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      padding: 15px;
      width: 200px;
      z-index: 1000;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .dark-mode .dropdown {
      background: #2a2a2a;
      color: white;
    }

    .dropdown.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* Additional styles for authentication and reset password forms */
    .auth-container, .reset-container {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
    }

    .dark-mode .auth-container, .dark-mode .reset-container {
      background: #222;
      color: white;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .dark-mode input {
      background: #333;
      color: white;
      border: 1px solid #555;
    }
  </style>
</head>
<body>
  <div class="account-section">
    <span id="user-info">Invité</span>
    <button onclick="toggleAuthForm()">Connexion</button>
    <button id="logout-btn" onclick="logout()" style="display:none;">Déconnexion</button>
  </div>

  <h1>Recherche Flox</h1>
  
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Entrez votre recherche..." />
    <button onclick="searchGoogle()">Rechercher</button>
  </div>

  <div class="buttons">
    <button onclick="toggleDarkMode()">Mode Sombre 🌙</button>
  </div>

  <footer>© 2025 Flox. Tous droits réservés.</footer>

  <!-- Auth Form -->
  <div class="auth-container" id="auth-form">
    <h2>Connexion / Inscription</h2>
    <input type="text" id="username" placeholder="Nom d'utilisateur">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
    <button onclick="register()">S'inscrire</button>
    <button onclick="toggleAuthForm()">Fermer</button>
  </div>

  <script>
    function searchGoogle() {
      const query = document.getElementById('searchInput').value.trim();
      if (query) {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      } else {
        alert('Veuillez entrer un terme de recherche.');
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }

    window.onload = function() {
      if (JSON.parse(localStorage.getItem('darkMode'))) {
        document.body.classList.add('dark-mode');
      }
      checkLoginStatus();
    };

    function toggleAuthForm() {
      const form = document.getElementById('auth-form');
      form.style.display = form.style.display === 'block' ? 'none' : 'block';
    }

    function register() {
      let username = document.getElementById('username').value.trim();
      let password = document.getElementById('password').value.trim();

      if (!username || !password) {
        alert("Remplissez tous les champs !");
        return;
      }

      let users = JSON.parse(localStorage.getItem('users')) || {};
      if (users[username]) {
        alert("Nom d'utilisateur déjà pris !");
        return;
      }

      users[username] = password;
      localStorage.setItem('users', JSON.stringify(users));
      alert("Compte créé avec succès !");
      toggleAuthForm();
    }

    function login() {
      let username = document.getElementById('username').value.trim();
      let password = document.getElementById('password').value.trim();

      let users = JSON.parse(localStorage.getItem('users')) || {};

      if (users[username] === password) {
        localStorage.setItem('currentUser', username);
        document.getElementById('user-info').textContent = username;
        document.getElementById('logout-btn').style.display = 'inline-block';
        toggleAuthForm();
      } else {
        alert("Nom d'utilisateur ou mot de passe incorrect !");
      }
    }

    function logout() {
      localStorage.removeItem('currentUser');
      document.getElementById('user-info').textContent = "Invité";
      document.getElementById('logout-btn').style.display = 'none';
    }

    function checkLoginStatus() {
      let user = localStorage.getItem('currentUser');
      if (user) {
        document.getElementById('user-info').textContent = user;
        document.getElementById('logout-btn').style.display = 'inline-block';
      }
    }
  </script>
</body>
</html>
